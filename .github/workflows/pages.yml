name: Deploy ORBIT to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate frontend configuration
        run: node scripts/generate-config.js
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          ORBIT_ADMIN_UIDS: ${{ vars.ORBIT_ADMIN_UIDS }}
          ORBIT_ADMIN_EMAILS: ${{ vars.ORBIT_ADMIN_EMAILS }}
          ORBIT_DEFAULT_CREDIT: ${{ vars.ORBIT_DEFAULT_CREDIT }}
          ORBIT_MAX_CREDIT: ${{ vars.ORBIT_MAX_CREDIT }}
          ORBIT_STORE_PAGE_SIZE: ${{ vars.ORBIT_STORE_PAGE_SIZE }}
          ORBIT_ADMIN_PAGE_SIZE: ${{ vars.ORBIT_ADMIN_PAGE_SIZE }}
          EMAILJS_SERVICE_ID: ${{ vars.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ vars.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ vars.EMAILJS_PUBLIC_KEY }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
